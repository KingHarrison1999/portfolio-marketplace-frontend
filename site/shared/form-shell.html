<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Form Shell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Styles/main.compiled.css" />
  <link rel="stylesheet" href="../Styles/site-footer.css" />
  <link rel="stylesheet" href="../Styles/masthead.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="../js/newsletter.js" defer></script>
  <script src="../js/site-banner.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/auth.js" defer></script>
</head>
<body>
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <script src="../js/masthead.js"></script>

  <div class="form-shell">
    <div class="form-shell-card">
      <div class="form-shell-header">
        <h1>Form title</h1>
        <p>Form subtitle placeholder text</p>
      </div>
      <form class="form-shell-fields">
        <div class="form-field">
          <label for="field-one">Field label one</label>
          <input type="text" id="field-one" placeholder="Enter a value…" />
          <p class="form-field-hint">We will only use this to send order updates.</p>
        </div>
        <div class="form-field">
          <label for="field-two">Field label two</label>
          <input type="text" id="field-two" placeholder="Enter a value…" />
          <p class="form-field-hint">At least 8 characters.</p>
        </div>
        <div class="form-field">
          <label for="field-three">Field label three</label>
          <input type="text" id="field-three" placeholder="Enter a value…" />
          <p class="form-field-hint">This is shown publicly on your listings.</p>
        </div>
        <button type="submit" class="btn-primary">Continue</button>
      </form>
    </div>
  </div>

  <script src="../js/site-footer.js"></script>
</body>
</html>
