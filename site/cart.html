<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
  <script src="js/theme.js" defer></script>
</head>
<body class="theme-light">
  <script>
    (function () {
      try {
        if (localStorage.getItem('marketplace-theme') === 'dark') {
          document.body.classList.add('theme-dark');
        }
      } catch (e) {}
    })();
  </script>
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <header class="global-nav">
    <div class="global-nav-inner">
      <a href="index.html" class="global-nav-logo">Marketplace</a>
      <a href="browse.html" class="global-nav-browse">Browse</a>
      <div class="global-nav-actions">
        <button class="mode-toggle pill-toggle" aria-pressed="false" title="Toggle light/dark">
          <span class="toggle-knob">
            <svg class="toggle-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <line x1="12" y1="2" x2="12" y2="4"></line>
              <line x1="12" y1="20" x2="12" y2="22"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="2" y1="12" x2="4" y2="12"></line>
              <line x1="20" y1="12" x2="22" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="toggle-icon moon-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
        </button>
        <a href="cart.html" class="global-nav-icon" aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="login.html" class="global-nav-icon" aria-label="Account"><i class="fa-solid fa-user"></i></a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1 class="cart-title">Cart</h1>

    <p id="cart-loading">Loading your cart&hellip;</p>

    <div id="cart-signin-required" class="cart-empty-state" hidden>
      <p>Please log in to view your cart.</p>
      <a href="login.html" class="btn-primary">Log In</a>
    </div>

    <div id="cart-empty" class="cart-empty-state" hidden>
      <p>Your cart is empty.</p>
      <a href="browse.html" class="btn-primary">Start Browsing</a>
    </div>

    <div class="cart-layout" id="cart-layout" hidden>
      <div class="cart-items" id="cart-items"></div>

      <aside class="order-summary">
        <h2>Order Summary</h2>
        <p id="cart-unavailable-notice" class="cart-unavailable-notice" hidden>
          One or more items above are no longer available in the requested quantity. Remove or update them before checking out.
        </p>
        <div class="order-summary-rows" id="cart-summary-rows"></div>
        <a href="checkout.html" class="btn-primary" id="cart-checkout-link" style="width: 100%;">Go to checkout</a>
      </aside>
    </div>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
