<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <link rel="stylesheet" href="Styles/masthead.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
</head>
<body class="theme-light">
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <script src="js/masthead.js"></script>

  <div class="container">
    <h1 class="cart-title">Cart</h1>

    <p id="cart-loading">Loading your cart&hellip;</p>

    <div id="cart-signin-required" class="cart-empty-state" hidden>
      <p>Please log in to view your cart.</p>
      <a href="login.html" class="btn-primary">Log In</a>
    </div>

    <div id="cart-empty" class="cart-empty-state" hidden>
      <p>Your cart is empty.</p>
      <a href="browse.html" class="btn-primary">Start Browsing</a>
    </div>

    <div class="cart-layout" id="cart-layout" hidden>
      <div class="cart-items" id="cart-items"></div>

      <aside class="order-summary">
        <h2>Order Summary</h2>
        <p id="cart-unavailable-notice" class="cart-unavailable-notice" hidden>
          One or more items above are no longer available in the requested quantity. Remove or update them before checking out.
        </p>
        <div class="order-summary-rows" id="cart-summary-rows"></div>
        <a href="checkout.html" class="btn-primary" id="cart-checkout-link" style="width: 100%;">Go to checkout</a>
      </aside>
    </div>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
