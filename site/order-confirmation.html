<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Confirmed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/addresses.js" defer></script>
  <script src="js/order-confirmation.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
</head>
<body>
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <header class="global-nav">
    <div class="global-nav-inner">
      <a href="index.html" class="global-nav-logo"><img src="Images/marketplace-logo.png" alt="Marketplace" /></a>
      <a href="browse.html" class="global-nav-browse">Browse</a>
      <div class="global-nav-actions">
        <a href="cart.html" class="global-nav-icon" aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="login.html" class="global-nav-icon" aria-label="Account"><i class="fa-solid fa-user"></i></a>
      </div>
    </div>
  </header>

  <div class="container">
    <p id="confirmation-loading">Loading your order&hellip;</p>

    <div id="confirmation-not-found" class="detail-not-found" hidden>
      <h1>Order not found</h1>
      <p>We couldn't find that order, or it doesn't belong to your account.</p>
      <a href="browse.html" class="btn-primary">Back to Browse</a>
    </div>

    <div class="order-confirmation" id="confirmation-content" hidden>
      <div class="order-confirmation-message">
        <i class="fa-solid fa-circle-check"></i>
        <h1>Order Placed</h1>
        <p id="confirmation-payment-notice">Thank you — your order has been placed.</p>
      </div>

      <div id="confirmation-orders"></div>

      <div class="order-confirmation-address">
        <h2>Shipping Address</h2>
        <address id="confirmation-address">Address on file.</address>
      </div>

      <a href="browse.html" class="btn-primary">Continue Shopping</a>
    </div>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
