<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Set New Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <link rel="stylesheet" href="Styles/masthead.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/password-update.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
</head>
<body>
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <script src="js/masthead.js"></script>

  <div class="form-shell">
    <div class="form-shell-card">
      <div class="form-shell-header">
        <h1>Set a new password</h1>
        <p>Choose a new password for your account.</p>
      </div>

      <p id="recovery-checking">Checking your reset link&hellip;</p>

      <form id="recovery-form" class="form-shell-fields" hidden>
        <div class="form-field">
          <label for="password">New password</label>
          <input type="password" id="password" placeholder="Enter a new password" minlength="6" required />
          <p class="form-field-hint">At least 6 characters.</p>
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter your new password" minlength="6" required />
        </div>
        <button type="submit" class="btn-primary">Update password</button>
        <div id="form-message" class="form-message" role="status"></div>
      </form>

      <div id="recovery-invalid" class="form-message form-message-error" hidden>
        <p>This password reset link is invalid or has expired.</p>
        <p><a href="password-reset.html">Request a new reset link</a></p>
      </div>
    </div>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
