<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin — Manage Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Styles/main.compiled.css" />
  <link rel="stylesheet" href="../Styles/site-footer.css" />
  <link rel="stylesheet" href="../Styles/masthead.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/admin-guard.js" defer></script>
  <script src="../js/admin-manage-users.js" defer></script>
  <script src="../js/newsletter.js" defer></script>
</head>
<body>
  <script src="../js/masthead.js"></script>
  <div class="dashboard-shell">
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-checkbox" />
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="sidebar-brand">
        <i class="fa-solid fa-user-shield"></i>
        <span>Admin Panel</span>
      </a>
      <ul class="dashboard-nav">
        <li><a href="dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a></li>
        <li><a href="manage-users.html" class="active"><i class="fa-solid fa-users"></i><span>Users</span></a></li>
        <li><a href="manage-listings.html"><i class="fa-solid fa-boxes-stacked"></i><span>Listings</span></a></li>
        <li><a href="categories.html"><i class="fa-solid fa-tags"></i><span>Categories</span></a></li>
        <li><a href="commission-settings.html"><i class="fa-solid fa-percent"></i><span>Commission</span></a></li>
        <li><a href="ad-spaces.html"><i class="fa-solid fa-rectangle-ad"></i><span>Ad Spaces</span></a></li>
        <li><a href="../account/settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
      </ul>
    </aside>
    <label for="sidebar-toggle" class="sidebar-toggle-backdrop"></label>
    <main class="dashboard-main">
      <label for="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></label>

      <div id="users-signin-required" class="cart-empty-state" hidden>
        <p>Log in as an admin to view this page.</p>
      </div>

      <div id="users-forbidden" class="cart-empty-state" hidden>
        <p>This area is for admins only.</p>
      </div>

      <div id="users-content" hidden>
      <div class="list-shell-header">
        <h1>Manage Users</h1>
      </div>
      <!-- "Pending"/"Approve" dropped: there's no seller-approval workflow
           anywhere in the schema (a user is a seller the moment role is set
           to 'seller' -- nothing gates or queues that). "Active"/"Suspended"
           are real: suspension is a genuine Supabase Auth ban
           (auth.users.banned_until), not an invented flag. See
           js/admin-manage-users.js. -->
      <div class="list-tabs" id="list-tabs">
        <button type="button" class="list-tab active" data-status="">All</button>
        <button type="button" class="list-tab" data-status="active">Active</button>
        <button type="button" class="list-tab" data-status="suspended">Suspended</button>
      </div>
      <p id="users-empty" class="address-empty-note" hidden>No users yet.</p>
      <div class="list-table-wrap" id="users-table-wrap">
        <table class="list-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Commission Tier</th>
              <th>Status</th>
              <th>Join Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
      </div>
    </main>
  </div>

  <script src="../js/site-footer.js"></script>
</body>
</html>
