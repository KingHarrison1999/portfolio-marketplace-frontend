<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/register.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
</head>
<body>
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <header class="global-nav">
    <div class="global-nav-inner">
      <a href="index.html" class="global-nav-logo"><img src="Images/marketplace-logo.png" alt="Marketplace" /></a>
      <a href="browse.html" class="global-nav-browse">Browse</a>
      <div class="global-nav-actions">
        <a href="cart.html" class="global-nav-icon" aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="login.html" class="global-nav-icon" aria-label="Account"><i class="fa-solid fa-user"></i></a>
      </div>
    </div>
  </header>

  <div class="form-shell">
    <div class="form-shell-card">
      <div class="form-shell-banner">
        <span>Already have an account?</span>
        <a href="login.html" class="btn-secondary">Log in</a>
      </div>
      <div class="form-shell-header">
        <h1>Create your account</h1>
        <p>Sign up to buy or sell on Marketplace.</p>
      </div>
      <form class="form-shell-fields">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email address" required />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Choose a password" minlength="6" required />
          <p class="form-field-hint">At least 6 characters.</p>
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter your password" minlength="6" required />
        </div>
        <button type="submit" class="btn-primary">Create account</button>
        <div id="form-message" class="form-message" role="status"></div>
      </form>
    </div>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
