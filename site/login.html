<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
</head>
<body class="theme-light">
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <script src="js/masthead.js"></script>

  <div class="form-shell">
    <div class="form-shell-card">
      <div class="form-shell-banner">
        <span>New here?</span>
        <a href="register.html" class="btn-secondary">Create account</a>
      </div>
      <div class="form-shell-header">
        <h1>Log in to your account</h1>
        <p>Enter your email and password to continue.</p>
      </div>
      <form class="form-shell-fields">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email address" required />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn-primary">Log in</button>
        <div id="form-message" class="form-message" role="status"></div>
        <p><a href="password-reset.html">Forgot your password?</a></p>
      </form>
    </div>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
