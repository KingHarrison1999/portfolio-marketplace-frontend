<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Cancelled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="../favicon.png" type="image/png" sizes="32x32" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Styles/main.compiled.css" />
  <link rel="stylesheet" href="../Styles/site-footer.css" />

<body>
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>

  <div class="container">
    <div class="order-confirmation">
      <div class="order-confirmation-message">
        <i class="fa-solid fa-circle-xmark"></i>
        <h1>Payment Cancelled</h1>
        <p>
          You cancelled payment before it completed -- no charge has been made. Your order is

      <a href="#" id="cancel-view-order-link" class="btn-primary">View Order</a>
      <a href="../browse.html" class="btn-secondary">Continue Shopping</a>
    </div>
  </div>
