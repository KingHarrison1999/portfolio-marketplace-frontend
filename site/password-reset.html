<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/password-reset.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
</head>
<body>
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <script src="js/masthead.js"></script>

  <div class="form-shell">
    <div class="form-shell-card">
      <div class="form-shell-header">
        <h1>Reset your password</h1>
        <p>Enter your email address and we'll send you a link to reset it.</p>
      </div>
      <form class="form-shell-fields">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email address" />
          <p class="form-field-hint">We'll send a password reset link to this address.</p>
        </div>
        <button type="submit" class="btn-primary">Send reset link</button>
        <div id="form-message" class="form-message" role="status"></div>
      </form>
    </div>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
