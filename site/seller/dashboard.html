<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shop Manager — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="../favicon.png" type="image/png" sizes="32x32" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Styles/main.compiled.css" />
  <link rel="stylesheet" href="../Styles/site-footer.css" />
  <link rel="stylesheet" href="../Styles/masthead.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/seller-dashboard.js" defer></script>
  <script src="../js/newsletter.js" defer></script>
</head>
<body>
  <script src="../js/masthead.js"></script>
  <div class="dashboard-shell">
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-checkbox" />
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="sidebar-brand">
        <i class="fa-solid fa-store"></i>
        <span>Shop Manager</span>
      </a>
      <ul class="dashboard-nav">
        <li><a href="dashboard.html" class="active"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a></li>
        <li><a href="listings.html"><i class="fa-solid fa-boxes-stacked"></i><span>Listings</span></a></li>
        <li><a href="../account/settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
      </ul>
    </aside>
    <label for="sidebar-toggle" class="sidebar-toggle-backdrop"></label>
    <main class="dashboard-main">
      <label for="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></label>
      <h1>Dashboard</h1>

      <div id="dashboard-signin-required" class="cart-empty-state" hidden>
        <p>Log in as a seller to view your dashboard.</p>
      </div>

      <div id="dashboard-forbidden" class="cart-empty-state" hidden>
        <p>This area is for sellers only.</p>
      </div>

      <div id="dashboard-content" hidden>
        <section class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Active Listings</div>
            <div class="stat-value" id="stat-active-listings">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Items Sold</div>
            <div class="stat-value" id="stat-sold">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Stock</div>
            <div class="stat-value" id="stat-total-stock">—</div>
          </div>
        </section>

        <h2>Recent Orders</h2>
        <p id="recent-orders-empty" class="address-empty-note" hidden>No orders yet.</p>
        <div class="list-table-wrap" id="recent-orders-table-wrap" hidden>
          <table class="list-table">
            <thead>
              <tr>
                <th>Order</th>
                <th>Item</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recent-orders-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/site-footer.js"></script>
</body>
</html>
