<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browse — Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <link rel="stylesheet" href="Styles/masthead.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/browse.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
  <script src="js/custom-select.js" defer></script>
</head>
<body class="theme-light">
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <script src="js/masthead.js"></script>

  <div class="container">
    <h1 class="browse-title">Browse All</h1>

    <section class="shop-layout">
      <button class="floating-filter-btn" id="floating-filter-btn" aria-label="Open filters">
        <i class="fa-solid fa-filter"></i>
      </button>

      <div class="filter-overlay" id="filter-overlay">
        <div class="filters">
          <div class="filter-header">
            <h3>Filters</h3>
            <button class="filter-close" aria-label="Close filters">
              <i class="fa-solid fa-times"></i>
            </button>
          </div>

          <fieldset class="brands" id="category-filter-list">
            <legend>Category</legend>
            <!-- Populated from GET /api/categories -- see js/browse.js.
                 Checkboxes: the backend accepts multiple category_id
                 params and filters by ANY of them (OR). -->
          </fieldset>

          <label>Max Price
            <input type="range" class="price-slider" id="price-slider" min="0" max="500" step="5" value="500" />
          </label>
          <div class="price-display" id="price-display">Up to £500</div>

          <fieldset class="brands" id="condition-filter-list">
            <legend>Condition</legend>
            <!-- The full real listings.condition enum (see the DB CHECK
                 constraint), not just New/Used -- the old mock list was
                 missing two of the four real values. -->
            <label><input type="checkbox" value="new" /> New</label>
            <label><input type="checkbox" value="like_new" /> Like New</label>
            <label><input type="checkbox" value="used" /> Used</label>
            <label><input type="checkbox" value="for_parts" /> For Parts</label>
          </fieldset>

          <div class="filter-actions">
            <button type="button" class="btn-apply" id="btn-apply-filters">Apply Filters</button>
            <button type="button" class="btn-reset" id="btn-reset-filters">Reset</button>
          </div>
        </div>
      </div>

      <section class="results">
        <div class="toolbar">
          <div class="sort">
            <label for="sort1">Sort by</label>
            <select id="sort1" class="js-custom-select">
              <option value="newest">Newly Listed</option>
              <option value="price_asc">Price Low-High</option>
              <option value="price_desc">Price High-Low</option>
            </select>
          </div>
          <form class="search small" id="browse-search-form">
            <input type="search" placeholder="Search within results…" id="browse-search-input" />
            <button type="submit" class="btn-primary">Search</button>
          </form>
        </div>

        <div class="product-grid uniform" id="listings-grid">
          <p class="results-loading">Loading listings&hellip;</p>
        </div>
      </section>
    </section>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
