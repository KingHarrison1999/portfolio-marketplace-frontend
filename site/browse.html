<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browse — Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/main.compiled.css" />
  <link rel="stylesheet" href="Styles/site-footer.css" />
  <link rel="stylesheet" href="Styles/masthead.css" />
  <link rel="stylesheet" href="Styles/shop.css" />
  <link rel="stylesheet" href="Styles/shop-filters.css" />
  <script src="https://kit.fontawesome.com/66b2869aef.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/shop-card.js" defer></script>
  <script src="js/shop-filters.js" defer></script>
  <script src="js/browse.js" defer></script>
  <script src="js/newsletter.js" defer></script>
  <script src="js/site-banner.js" defer></script>
  <script src="js/custom-select.js" defer></script>
</head>
<body class="theme-light">
  <div id="site-announcement-banner" class="site-announcement-banner" hidden></div>
  <script src="js/masthead.js"></script>

  <div class="container">
    <h1 class="browse-title" id="browse-title">Browse All</h1>

    <section class="shop-layout shop shop-page">
      <!-- Filled by js/shop-filters.js (shared with the homepage). Shown at
           1024px and wider; below that the same filters are in the floating
           search panel (js/masthead.js). -->
      <aside class="shop-sidebar" aria-label="Filters">
        <h3>Filters</h3>
        <div id="browse-filters"></div>
      </aside>

      <section class="results">
        <div class="toolbar">
          <div class="sort">
            <label for="sort1">Sort by</label>
            <select id="sort1" class="js-custom-select">
              <option value="newest">Newly Listed</option>
              <option value="price_asc">Price Low-High</option>
              <option value="price_desc">Price High-Low</option>
            </select>
          </div>
          <form class="search small" id="browse-search-form">
            <input type="search" placeholder="Search within results…" id="browse-search-input" />
            <button type="submit" class="btn-primary">Search</button>
          </form>
        </div>

        <div class="shop-grid" id="listings-grid">
          <p class="results-loading">Loading listings&hellip;</p>
        </div>
      </section>
    </section>
  </div>

  <script src="js/site-footer.js"></script>
</body>
</html>
