<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Marketplace — Design Chooser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- <link rel="stylesheet" href="showcase.css" /> -->
  <link rel="stylesheet" href="Styles/main.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      height: 100vh;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line, #e5e7eb);
      height: 60px;
      display: flex;
      align-items: center;
    }

    header .wrap {
      width: 100%;
      max-width: 100%;
      padding: 0 1rem;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      height: 100%;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .navbar-left .label {
      font-weight: 600;
      margin-right: 0.25rem;
    }

    .navbar-left label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
    }

    .navbar-left input[type="radio"] {
      margin: 0;
    }

    .device {
      display: inline-flex;
      gap: 0.25rem;
    }

    .stage-wrap {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      overflow: auto;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }

    .frame-shell {
      margin: 0 auto;
      background: #111827;
      border-radius: 0.5rem;
      border: 1px solid #1f2937;
      box-shadow: 0 6px 24px rgba(17, 24, 39, .25);
      transition: width 0.3s ease;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: block;
    }

    footer {
      display: none;
    }

    /* Mobile only: Hide Desktop and Tablet device buttons */
    @media (max-width: 768px) {
      .device .btn[data-w="768"],
      .device .btn[data-w="1200"] {
        display: none;
      }

      /* Hide Mobile button on mobile */
      .device .btn[data-w="390"] {
        display: none;
      }

      /* Hide "Open in new tab" button on mobile */
      #openNew {
        display: none;
      }

      /* Remove padding on .stage to eliminate grey bar - reserved space removed */
      .stage {
        padding: 0;
      }
    }

    /* Hide "Open in Browser" button on tablet and desktop */
    @media (min-width: 768px) {
      .navbar-left .btn-open-browser-mobile {
        display: none;
      }

      .showcase-cta {
        display: none;
      }

      /* Show device buttons and Open in Browser on tablet/desktop */
      .navbar-right {
        display: flex;
      }
    }

    /* Hide device buttons and Open in Browser on mobile */
    @media (max-width: 768px) {
      .navbar-right {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav class="navbar">
        <div class="navbar-left">
          <button id="openInBrowser" class="btn-open-browser-mobile" type="button">Open in Browser</button>
          <div class="design-selectors">
            <span class="label">Design</span>
            <label><input type="radio" name="design" value="1" checked> Design 1</label>
            <label><input type="radio" name="design" value="2"> Design 2</label>
            <label><input type="radio" name="design" value="3"> Design 3</label>
            <label><input type="radio" name="design" value="4"> Design 4</label>
          </div>
        </div>
        <div class="navbar-right">
          <div class="device">
            <button class="btn" data-w="390" type="button">Mobile</button>
            <button class="btn" data-w="768" type="button">Tablet</button>
            <button class="btn" data-w="1200" type="button">Desktop</button>
          </div>
          <button id="openNew" class="btn primary" type="button">Open in Browser</button>
        </div>
      </nav>
    </div>
  </header>

  <!-- Mobile only: "Open in Browser" CTA button -->
  <div class="showcase-cta">
    <button id="openInBrowser" class="btn-open-browser" type="button">Open in Browser</button>
  </div>

  <div class="stage-wrap">
    <div class="stage">
      <div id="frameShell" class="frame-shell" style="width: 1200px; height: calc(100vh - 60px - 1.5rem);">
        <iframe id="preview" title="Design Preview" src="../index.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const frame = document.getElementById('preview');
      const shell = document.getElementById('frameShell');
      const openBtn = document.getElementById('openNew');
      const navbar = document.querySelector('.navbar');
      
      const navbarHeight = 60;

      // Explicit design mapping to prevent NaN errors
      const designMap = {
        1: '/index.html',
        2: '/Diecast/design2.html',
        3: '/Diecast/design3.html',
        4: '/Diecast/design4.html'
      };

      function currentDesign() {
        const checked = navbar.querySelector('input[name="design"]:checked');
        if (!checked) return 1; // Fallback to Design 1
        const num = parseInt(checked.value, 10);
        // Ensure valid number between 1-4, fallback to 1
        if (isNaN(num) || num < 1 || num > 4) return 1;
        return num;
      }

      function srcForDesign(n) {
        return designMap[n] || designMap[1]; // Fallback to Design 1
      }

      function setDesign(n) {
        const src = srcForDesign(n);
        frame.src = src;
      }

      // Handle design selection changes
      navbar.addEventListener('change', (e) => {
        if (e.target.name === 'design') {
          const designNum = parseInt(e.target.value, 10);
          if (!isNaN(designNum) && designNum >= 1 && designNum <= 4) {
            setDesign(designNum);
          } else {
            setDesign(1); // Fallback to Design 1
          }
        }
      });

      // Handle device width buttons
      document.querySelectorAll('[data-w]').forEach(btn => {
        btn.addEventListener('click', () => {
          const w = parseInt(btn.getAttribute('data-w'), 10);
          if (!isNaN(w) && w > 0) {
            // Set iframe width, but keep it centered
            shell.style.width = w + 'px';
            // Update height to fill available space
            shell.style.height = `calc(100vh - 60px - 1.5rem)`;
          }
        });
      });

      // Open in new tab
      if (openBtn) {
        openBtn.addEventListener('click', () => {
          const n = currentDesign();
          const src = srcForDesign(n);
          window.open(src, '_blank', 'noopener,noreferrer');
        });
      }

      // "Open in Browser" button (now in navbar-left on mobile, or showcase-cta on desktop)
      const openInBrowserBtn = document.getElementById('openInBrowser');
      if (openInBrowserBtn) {
        openInBrowserBtn.addEventListener('click', () => {
          // Open current design being previewed in new tab
          const n = currentDesign();
          const src = srcForDesign(n);
          window.open(src, '_blank', 'noopener,noreferrer');
        });
      }

      // Init default device width and height
      shell.style.width = '1200px';
      shell.style.height = `calc(100vh - 60px - 1.5rem)`;

      // Update iframe height when window resizes
      window.addEventListener('resize', () => {
        shell.style.height = `calc(100vh - 60px - 1.5rem)`;
      });
    })();
  </script>
</body>
